x-backend-templates:
  app: &app
    build:
      context: .
      dockerfile: Dockerfile
    image: ccs1201/rinha-backend-2025-ccs-boot:latest
    depends_on:
      - backend-db
    networks:
      - backend
      - payment-processor
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: "117.50MB"

  app-env: &app-env
    payment-processor-default-url: "payment-processor-default:8001"
    payment-processor-fallback-url: "payment-processor-fallback:8002"
    warmup: "true"
    server.port: "8080"
    thread-pool-size: "15"
    thread-queue-size: "20000"
    warmup_rounds: "5000"
    datasource-minimum-idle: "1"
    datasource-maximum-pool-size: "5"
    datasource-timeout: "5000"
    datasource-url: "jdbc:postgresql://postgres:5432/rinha"
    datasource-username: "rinha"
    datasource-password: "rinha"
    datasource-class-name: "org.postgresql.Driver"
    JAVA_OPTS: "-Dlogging.level.root=off -Dspring.threads.virtual.enabled=true -Xmx95m -Xms95m -XX:MaxMetaspaceSize=50m -XX:+UseSerialGC"

services:
  nginx:
    image: nginx:alpine
    container_name: backend-nginx
    hostname: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "9999:9999"
    depends_on:
      - app1
      - app2
    networks:
      - backend
      - payment-processor
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "15MB"

  app1:
    <<: *app
    container_name: backend-api1
    hostname: app1
    environment:
      <<: *app-env
      warmup_instance: "app2"

  app2:
    <<: *app
    container_name: backend-api2
    hostname: app2
    environment:
      <<: *app-env
      warmup_instance: "app1"

  backend-db:
    image: postgres:17-alpine
    container_name: backend-db
    hostname: postgres
    environment:
      POSTGRES_DB: rinha
      POSTGRES_USER: rinha
      POSTGRES_PASSWORD: rinha
    volumes:
      - ./init.sql/init-backend-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "100MB"

networks:
  backend:
    driver: bridge
  payment-processor:
    external: true
