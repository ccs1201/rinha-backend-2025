x-backend-templates:
  app: &app
    build:
      context: .
      dockerfile: Dockerfile
    image: ccs1201/rinha-backend-2025-jdbc:latest
    depends_on:
      - backend-db
    networks:
      - backend
      - payment-processor
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: "117.50MB"

  app-env: &app-env
    warmup: "true"
    server.port: "8080"
    thread_pool_size: "15"
    thread_queue_size: "20000"
    warmup_rounds: "10000"
    server.undertow.threads.io: "2"
    server.undertow.threads.worker: "30"
    spring.datasource.hikari.minimum-idle: "10"
    spring.datasource.hikari.maximum-pool-size: "10"
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/rinha"
    SPRING_DATASOURCE_USERNAME: "rinha"
    SPRING_DATASOURCE_PASSWORD: "rinha"
    JAVA_OPTS: "-Dlogging.level.root=error -Dspring.threads.virtual.enabled=true -Xmx95m -Xms95m -XX:MaxMetaspaceSize=50m -XX:+UseSerialGC -XX:+TieredCompilation -XX:TieredStopAtLevel=4 -XX:CompileThreshold=10"

services:
  nginx:
    image: nginx:alpine
    container_name: backend-nginx
    hostname: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "9999:9999"
    depends_on:
      - app1
      - app2
    networks:
      - backend
      - payment-processor
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "15MB"

  app1:
    <<: *app
    container_name: backend-api1
    hostname: app1
    environment:
      <<: *app-env
      warmup_instance: "app2"

  app2:
    <<: *app
    container_name: backend-api2
    hostname: app2
    environment:
      <<: *app-env
      warmup_instance: "app1"

  backend-db:
    image: postgres:17-alpine
    container_name: backend-db
    hostname: postgres
    environment:
      POSTGRES_DB: rinha
      POSTGRES_USER: rinha
      POSTGRES_PASSWORD: rinha
    volumes:
      - ./init.sql/init-backend-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "100MB"

networks:
  backend:
    driver: bridge
  payment-processor:
    external: true
