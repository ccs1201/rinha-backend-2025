x-backend-templates:
  app: &app
#    build:
#      context: .
#      dockerfile: Dockerfile
    image: csouzadocker/rinha-2025-redis:latest
    depends_on:
      redis:
        condition: service_started
    networks:
      - backend
      - payment-processor
    deploy:
      resources:
        limits:
          cpus: "0.65"
          memory: "140MB"

  app-env: &app-env
    SERVER_PORT: "8080"
    VIRTUAL_THREADS: "true"
    THREAD_POOL_SIZE: "50"
    REDIS_HOST: "redis"
    REQUEST_CONNECTION_TIMEOUT: "200"
    REQUEST_READ_TIMEOUT: "1500"
    payment-processor.default.url: "http://payment-processor-default:8080"
    payment-processor.fallback.url: "http://payment-processor-fallback:8080"
    JAVA_OPTS: >
      -Dlogging.level.root=warn
      -Dspring.threads.virtual.enabled=false
      -Dserver.undertow.threads.io=2
      -Dserver.undertow.threads.worker=50
  

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    hostname: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "9999:9999"
    depends_on:
      - app1
      - app2
    networks:
      - backend
      - payment-processor
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "15MB"

  app1:
    <<: *app
    container_name: backend-api1
    hostname: backend-api1
    environment:
      <<: *app-env

  app2:
    <<: *app
    container_name: backend-api2
    hostname: backend-api2
    environment:
      <<: *app-env

  redis:
    image: redis:7-alpine
    container_name: redis
    hostname: redis
    command: redis-server --maxmemory 45mb --maxmemory-policy allkeys-lru --save "" --tcp-keepalive 60 --timeout 0
    ports:
      - "6379:6379"
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "55MB"

networks:
  backend:
    driver: bridge
  payment-processor:
    external: true